name: Release and deploy

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*.*.*-*'

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate stable SemVer tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag '$TAG' is not a stable SemVer tag (expected vMAJOR.MINOR.PATCH)." >&2
            exit 1
          fi

      - name: Checkout main branch for changelog update
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Promote changelog entry
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          date_utc=$(date -u +%Y-%m-%d)

          if grep -q "^## \[$TAG\] - " CHANGELOG.md; then
            echo "CHANGELOG.md already contains $TAG; nothing to promote."
            exit 0
          fi

          if ! grep -q '^## \[Unreleased\]$' CHANGELOG.md; then
            echo "CHANGELOG.md has no [Unreleased] section." >&2
            exit 1
          fi

          awk -v tag="$TAG" -v date="$date_utc" '
            /^## \[Unreleased\]$/ {
              print "## [Unreleased]"
              print ""
              print "### Added"
              print ""
              print "- Nothing yet."
              print ""
              print "### Changed"
              print ""
              print "- Nothing yet."
              print ""
              print "### Fixed"
              print ""
              print "- Nothing yet."
              print ""
              print "## [" tag "] - " date
              in_unreleased = 1
              next
            }
            in_unreleased && /^## / { in_unreleased = 0 }
            { print }
          ' CHANGELOG.md > CHANGELOG.md.tmp
          mv CHANGELOG.md.tmp CHANGELOG.md

          sed -i "s#^\[unreleased\]:.*#\[unreleased\]: https://github.com/cniweb/monero-balena/compare/$TAG...HEAD#" CHANGELOG.md
          printf '\n[%s]: https://github.com/cniweb/monero-balena/releases/tag/%s\n' "$TAG" "$TAG" >> CHANGELOG.md

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add CHANGELOG.md
          git commit -m "docs: promote $TAG changelog [skip ci]"
          git push origin HEAD:main

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true

  deploy:
    name: Deploy to Balena
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: production
    concurrency:
      group: balena-production
      cancel-in-progress: false
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6

      - name: Install balena CLI
        uses: actions/setup-node@v7
        with:
          node-version: '24.11.0'

      - name: Install balena CLI package
        run: npm install --global --production balena-cli@25.2.5

      - name: Verify balena CLI
        run: balena version

      - name: Push release to Balena
        env:
          BALENA_TOKEN: ${{ secrets.BALENA_TOKEN }}
        run: |
          test -n "$BALENA_TOKEN"
          balena login --token "$BALENA_TOKEN"
          balena push gh_cniweb/cpuminer
